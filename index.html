<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Project Dashboard</title>
  <meta name="color-scheme" content="dark light">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%230f0f11'/%3E%3Ccircle cx='16' cy='16' r='9' fill='none' stroke='%232a2a30' stroke-width='3'/%3E%3Cpath d='M16 7a9 9 0 0 1 9 9' fill='none' stroke='%2334d399' stroke-width='3' stroke-linecap='round'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/app.css">
  <script>
    // Apply saved theme before paint to avoid a flash.
    try { const t = localStorage.getItem('pd.theme'); if (t) document.documentElement.dataset.theme = t; } catch (e) {}
  </script>
</head>
<body>
  <header class="topbar">
    <div class="topbar-row">
      <div class="brand">
        <h1>Projects</h1>
        <span class="today" id="today"></span>
      </div>
      <div class="topbar-actions">
        <span class="sync" id="sync" aria-live="polite"></span>
        <button class="icon-btn" id="btn-refresh" title="Refresh now (R)" aria-label="Refresh now">
          <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M16 10a6 6 0 1 1-1.76-4.24M16 4v3.5h-3.5"/></svg>
        </button>
        <button class="icon-btn" id="btn-theme" title="Toggle light/dark (T)" aria-label="Toggle light or dark theme">
          <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M10 3a7 7 0 1 0 7 7 5.5 5.5 0 0 1-7-7Z"/></svg>
        </button>
        <button class="icon-btn" id="btn-signout" title="Sign out" aria-label="Sign out">
          <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M8 4H5.5A1.5 1.5 0 0 0 4 5.5v9A1.5 1.5 0 0 0 5.5 16H8M12.5 13.5 16 10l-3.5-3.5M16 10H8"/></svg>
        </button>
        <button class="icon-btn" id="btn-settings" title="Settings" aria-label="Open settings">
          <svg viewBox="0 0 20 20" aria-hidden="true"><circle cx="10" cy="10" r="2.5"/><path d="M10 2.5v2M10 15.5v2M2.5 10h2M15.5 10h2M4.7 4.7l1.4 1.4M13.9 13.9l1.4 1.4M4.7 15.3l1.4-1.4M13.9 6.1l1.4-1.4"/></svg>
        </button>
      </div>
    </div>

    <div class="stats" id="stats"></div>

    <div class="toolbar">
      <nav class="views" role="tablist" aria-label="View">
        <button role="tab" data-view="board">Overview</button>
        <button role="tab" data-view="grid">Cards</button>
        <button role="tab" data-view="schedule">Today</button>
        <button role="tab" data-view="timeline">Timeline</button>
      </nav>
      <div class="filters">
        <label class="search">
          <span class="sr-only">Search projects</span>
          <svg viewBox="0 0 20 20" aria-hidden="true"><circle cx="9" cy="9" r="5.5"/><path d="m13.5 13.5 3 3"/></svg>
          <input id="f-search" type="search" placeholder="Search" autocomplete="off">
          <kbd>/</kbd>
        </label>
        <label class="select">
          <span class="sr-only">Category</span>
          <select id="f-category"><option value="">All categories</option></select>
        </label>
        <div class="seg" role="group" aria-label="Priority" id="f-priority">
          <button data-p="High">High</button><button data-p="Medium">Med</button><button data-p="Low">Low</button>
        </div>
        <label class="toggle"><input type="checkbox" id="f-today"><span>Today's 5</span></label>
        <label class="toggle"><input type="checkbox" id="f-completed"><span>Completed</span></label>
        <label class="select sort-only">
          <span class="sr-only">Sort</span>
          <select id="f-sort">
            <option value="recent">Sort: Recently worked</option>
            <option value="neglected">Sort: Most neglected</option>
            <option value="priority">Sort: Priority</option>
            <option value="due">Sort: Due date</option>
          </select>
        </label>
      </div>
    </div>
  </header>

  <div class="banner" id="banner" hidden></div>
  <main id="main" tabindex="-1"></main>

  <!-- Focus mode -->
  <div class="scrim" id="scrim" hidden></div>
  <aside class="focus" id="focus" role="dialog" aria-modal="true" aria-labelledby="focus-title" hidden></aside>

  <!-- Settings -->
  <aside class="drawer" id="settings" role="dialog" aria-modal="true" aria-labelledby="settings-title" hidden>
    <div class="drawer-head">
      <h2 id="settings-title">Settings</h2>
      <button class="icon-btn" data-close aria-label="Close settings"><svg viewBox="0 0 20 20" aria-hidden="true"><path d="m5 5 10 10M15 5 5 15"/></svg></button>
    </div>
    <form id="settings-form" class="drawer-body">
      <div class="field">
        <label for="s-token">Passcode</label>
        <input id="s-token" type="password" autocomplete="off" spellcheck="false">
        <p class="hint">Stored only in this browser until you sign out.</p>
      </div>
      <details class="adv">
        <summary>Apps Script URL</summary>
      <div class="field" style="margin-top:10px">
        <label for="s-url">Apps Script web app URL</label>
        <input id="s-url" type="url" inputmode="url" spellcheck="false" placeholder="https://script.google.com/macros/s/…/exec">
        <p class="hint">From Deploy → New deployment in your sheet's Apps Script. See the setup guide.</p>
      </div>
      </details>
      <label class="toggle row"><input type="checkbox" id="s-auto"><span>Auto-refresh every 5 minutes</span></label>
      <p class="field-error" id="s-error" role="alert"></p>
      <div class="drawer-actions">
        <button type="submit" class="btn primary">Save</button>
        <button type="button" class="btn ghost danger" id="s-signout">Sign out</button>
      </div>
      <p class="hint"><a href="https://github.com/adnanpk/project-dashboard/blob/main/SETUP.md" target="_blank" rel="noopener">Open the setup guide</a></p>
    </form>
  </aside>

  <div class="menu" id="menu" role="menu" hidden></div>
  <div class="toasts" id="toasts" aria-live="polite"></div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
